name: Release

# Tag-driven: pushing v1.0.0 builds the app and attaches the executable to that release,
# so the download link in the README always points at a build from a known commit.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # The app is a self-contained win-x64 build and publish.ps1 is PowerShell, so this
    # cannot run on a Linux runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build and test
        run: |
          dotnet build Visualization_engine/SynthesiaClone.csproj -c Release
          dotnet test Visualization_engine.Tests -c Release

      - name: Publish
        # Reuses the script developers run locally rather than repeating its flags here,
        # so the two cannot drift. It also asserts that the Inter fonts and bridge.py
        # landed beside the executable, which is the packaging failure worth catching.
        run: pwsh -ExecutionPolicy Bypass -File scripts/publish.ps1

      - name: Package
        # The whole publish folder, not just the .exe. PublishSingleFile bundles the .NET
        # runtime, but assets/** is deliberately ExcludeFromSingleFile because UiDesign
        # loads fonts from disk relative to AppContext.BaseDirectory, and Bridge/*.py has
        # to sit beside the executable for OMR to run at all. Shipping the bare .exe gives
        # the user Raylib's fallback font and no recognition pipeline.
        run: |
          Remove-Item dist/*.pdb -ErrorAction SilentlyContinue
          Get-ChildItem dist -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Compress-Archive -Path dist/* -DestinationPath Sheet2Play-win-x64.zip
        shell: pwsh

      - name: Attach the package to the release
        uses: softprops/action-gh-release@v2
        with:
          files: Sheet2Play-win-x64.zip
          generate_release_notes: true
